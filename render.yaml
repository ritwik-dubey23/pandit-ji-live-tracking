services:
  # Backend Web Service (Express + Socket.IO + MongoDB)
  - type: web
    name: pandit-ji-backend
    env: node
    plan: free
    rootDir: pandit-ji-backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "8000"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false

  # Frontend Static Site (Vite + React SPA)
  - type: web
    name: pandit-ji-frontend
    env: static
    rootDir: pandit-ji-frontend
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_SERVER_URL
        sync: false
